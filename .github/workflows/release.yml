name: Build and Release .NET App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Prepare config files
        run: |
          cp -f PRReviewAgent/config.template.toml PRReviewAgent/config.toml
          cp -f PRReviewAgent/secrets.template.toml PRReviewAgent/secrets.toml

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish linux-x64
        run: |
          dotnet publish PRReviewAgent/PRReviewAgent.csproj -c Release -r linux-x64 -o ./publish/PRReviewAgent-linux-x64

      - name: Publish win-x64
        run: |
          dotnet publish PRReviewAgent/PRReviewAgent.csproj -c Release -r win-x64 -o ./publish/PRReviewAgent-win-x64

      - name: Copy resources into packages
        run: |
          for target in linux-x64 win-x64; do
            dest=./publish/PRReviewAgent-$target
            cp PRReviewAgent/config.template.toml  "$dest/config.template.toml"
            cp PRReviewAgent/secrets.template.toml "$dest/secrets.template.toml"
            cp -r PRReviewAgent/Templates          "$dest/Templates"
            cp -r PRReviewAgent/Models             "$dest/Models"
          done

      - name: Install project licenses tool
        run: |
            dotnet tool install --global nuget-license
            echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Generate and Combine Licenses
        run: |
          mkdir -p ./publish
          
          nuget-license -i PRReviewAgent/PRReviewAgent.csproj --output json --include-transitive > ./publish/packages.json
          
          echo "Gathering NuGet package licenses..."
          echo -e "Generated Package License List\n==============================" > ./publish/nuget-licenses.txt
          nuget-license -i PRReviewAgent/PRReviewAgent.csproj -o Json | jq -r '.[] | "# \(.PackageId)\nCopyright: \(.Copyright)\nLicense: \(.License)\n"' >> ./publish/nuget-licenses.txt
          
          MY_LICENSE="LICENSE"
          if [ ! -f "LICENSE" ] && [ -f "LICENSE.txt" ]; then
            MY_LICENSE="LICENSE.txt"
          fi

          for target in linux-x64 win-x64; do
            dest=./publish/PRReviewAgent-$target
            out_file="$dest/THIRD-PARTY-NOTICES.txt"
            
            if [ -f "$MY_LICENSE" ]; then
              cat "$MY_LICENSE" > "$out_file"
              echo -e "\n\n" >> "$out_file"
            fi
            
            if [ -f "PRReviewAgent/Models/LICENSE" ]; then
              echo -e "========================================================================\n" >> "$out_file"
              echo -e "  Model's Licenses\n" >> "$out_file"
              echo -e "========================================================================\n" >> "$out_file"
              cat PRReviewAgent/Models/LICENSE >> "$out_file"
              echo -e "\n\n" >> "$out_file"
            fi
            
            if [ -f "./publish/nuget-licenses.txt" ]; then
              echo -e "========================================================================\n" >> "$out_file"
              echo -e "  NuGet Packages Licenses\n" >> "$out_file"
              echo -e "========================================================================\n" >> "$out_file"
              cat ./publish/nuget-licenses.txt >> "$out_file"
            fi
          done
          
          rm -f ./publish/packages.json ./publish/nuget-licenses.txt

      - name: Create Artifacts linux-x64
        run: |
          cd ./publish && tar -czf ../PRReviewAgent-linux-x64.tar.gz ./PRReviewAgent-linux-x64 && cd ..

      - name: Create Artifacts win-x64
        run: |
          cd ./publish && zip -r ../PRReviewAgent-win-x64.zip ./PRReviewAgent-win-x64 && cd ..

