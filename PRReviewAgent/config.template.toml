[common]
default_language = "ja"
git_provider = "github"
warm_up = true

[server]
url = ""
log_level = "Warning"
trust_certificate = false # always trust certificate
trusted_certificates = [""]

[agent]
# Main LLM used for code review.
# Should use the model intended for code-review quality (long context, strong reasoning).
reviewer = "http://localhost:9090/v1"
reviewer_name = "Reviewer"
reviewer_model = ""
reviewer_instructions = "You are a strict and accurate code reviewer."
reviewer_max_output = 16384
reviewer_temperature = 1.0
reviewer_topp = 0.95
reviewer_frequency_penalty = 1.1
reviewer_thinking_effort = 1 # None:0 Low:1 Medium:2 High:3
reviewer_thinking_output = 0 # None:0 Summary:1 Full:2
reviewer_timeout = 1200

[github]
name = "XXX" # repository username
ssl_verify = true

[gitlab]
url = ""
ssl_verify = false

[review]
# file extensions to review
target_extensions = ["c","cpp", "cxx", "cc", "h", "hpp", "inl", "cs", "py", "rs"]

[auto_improve]
# Optional project-adaptation feature.
# Stores and retrieves learned project-specific review rules from merged changes.
enabled = false
# Local embedding model (GGUF format) used to embed learned rules.
model_path = "Models/granite-embedding-97M-multilingual-r2-Q8_0.gguf"
# SQLite database storing learned rules.
db_path = "AppData/review_rules.db"
stale_rule_months = 3
min_confidence_score = 5
context_size = 16384
chunk_overlap = 128

[subagent.rule_extraction]
# Smaller auxiliary LLM used only for project-specific rule extraction.
# Independent of the main reviewer — failures here do not affect normal code review.
enabled = false
endpoint = "http://localhost:9080/v1"
name = "RuleExtractor"
model = ""
max_output = 1024
temperature = 1.0
topp = 0.95
timeout = 120
