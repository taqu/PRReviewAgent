[common]
default_language = "ja"
git_provider = "github"
warm_up = true

[server]
url = ""
log_level = "Warning"
trust_certificate = false # always trust certificate
trusted_certificates = [""]

[agent]
# Used for each review and organizing reviews, needs long context and understanding long sentences.
reviewer = "https://api.openai.com/v1"
reviewer_name = "Reviewer"
reviewer_model = "gpt-5-mini"
reviewer_instructions = "You are a orrect and strict code reviewer."
reviewer_max_output = 16384
reviewer_temperature = 0.1
reviewer_topp = 0.9
reviewer_frequency_penalty = 0.0
reviewer_thinking_effort = 1 # None:0 Low:1 Medium:2 High:3
reviewer_thinking_output = 0 # None:0 Summary:1 Full:2
reviewer_timeout = 1200

[github]
name = "XXX" # repository username
ssl_verify = true

[gitlab]
url = ""
ssl_verify = false

[review]
# file extensions to review
target_extensions = ["c","cpp", "cxx", "cc", "h", "hpp", "inl", "cs", "py", "rs"]

[auto_improve]
enabled = false
model_path = "Models/granite-embedding-97M-multilingual-r2-Q8_0.gguf"
db_path = "AppData/review_rurles.db"
stale_rule_months = 3
min_confidence_score = 7
context_size = 16384
chunk_overlap = 128

